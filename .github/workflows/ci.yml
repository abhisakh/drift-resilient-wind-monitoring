name: CI

# The suite runs in a few seconds and needs none of the 19 GB of raw data:
# every test either uses synthetic data or skips itself when the dataset is
# absent. So CI is cheap, and it can run on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported version: the benchmark authors' CARE scorer
        # (energy-fault-detector 0.8.1) declares Python < 3.12.
        #
        # 3.12 is also tested, to catch anything that depends on a
        # version-specific behaviour. The reference package is not installed
        # there (requirements.txt gates it on python_version < "3.12"), so the
        # tests that cross-check against it skip themselves and the rest still
        # run. A failure on 3.12 is a real signal about our own code.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q src scripts tests

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Reproduce the documentation from results/
        # The report generator is the single source of truth for README.md.
        # Re-running it must reproduce the committed file EXACTLY -- otherwise
        # the documentation and the artefacts have drifted apart, and the
        # numbers in the README cannot be trusted.
        #
        # This step is also what would catch a broken pipeline script: the
        # learned-model arm once died with a NameError while its committed
        # result still looked perfectly fine, because nothing ever ran it.
        run: |
          python scripts/pipeline/10_summary.py
          python scripts/pipeline/09_report.py
          if ! git diff --quiet -- README.md results/summary.json; then
            echo "::error::Re-running the report generator did not reproduce the committed README.md / results/summary.json. Run 'make pipeline' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Check the working tree is clean
        # The report generator rewrites README.md from results/. If a test
        # wrote into results/, or a result file drifted, the tree would be
        # dirty -- which means the committed numbers and the documentation
        # disagree. That must fail the build.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The working tree changed. Re-run 'make pipeline' and commit the regenerated results/ and README.md."
            git --no-pager status --porcelain
            git --no-pager diff --stat
            exit 1
          fi
